name: hopeit-agents PyPI Publishing

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  upload:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Install development dependencies
        run: make install-dev

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build hopeit-agents
        run: make dist-plugin PLUGINFOLDER=plugins/agents

      - name: Publish hopeit-agents to PyPI
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: make publish-plugin-pypi PLUGINFOLDER=plugins/agents
