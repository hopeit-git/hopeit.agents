name: hopeit-agents TestPyPI Publishing

on:
  release:
    types: [prereleased]

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Install development dependencies
        run: make install-dev

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build hopeit-agents
        run: make dist-plugin PLUGINFOLDER=plugins/agents

      - name: Publish hopeit-agents to TestPyPI
        env:
          TEST_PYPI_API_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: make publish-plugin-pypi-test PLUGINFOLDER=plugins/agents
